<!DOCTYPE html>
<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <script>
            let t1= "Здравейте";
            let t2= "Добре дошли в моята";
            let t3= "JavaScript страница.";
            let n1= 10;
            let Text4= "5";
            let n2;
            let Booll= true;
            let Text= "4.5+5.5";
            document.write("<h1>"+t1.concat(t2,t3)+"</h1>");
            document.write("<br />");
            document.write("t1:"+typeof(t1));
            document.write("<br />");
            document.write("t2:"+typeof(t2));
            document.write("<br />");
            document.write("t3:"+typeof(t3));
            document.write("<br />");
            document.write("n1:"+typeof(n1));
            document.write("<br />");
            document.write("Text4:"+typeof(Text4));
            document.write("<br />");
            document.write("n2:"+typeof(n2));
            document.write("<br />");
            document.write("Booll:"+typeof(Booll));
            document.write("<br />");
            document.write("Text:"+typeof(Text));
            let t4 = t1.concat(t2,t3);
            document.write("<br />");
            document.write(t4.replace("JavaScript","HTML"));
            document.write("<br />");
            n2= 20.5;
            document.write(n1+n2);
            document.write("<br />");
            document.write(n2+parseInt(Text4));
            document.write("<br />");
            document.write(eval(Text));
            
            let imena = prompt("Как се казвате?");
            let egn = prompt("Какво е вашето ЕГН?");
            document.write("<br />");
            document.write("Вашите имена са:"+imena);
            let godina = egn.substr(0,2);
            let mesec = egn.substr(2,2)-40;
            let den = egn.substr(4,2);
            document.write("Вие сте родени на:" +den+"."+mesec+"."+godina+"г.");
            function fun() {
                let price = prompt("Колко пари");
                document.getElementById("result").innerHTML = "Цената е:"+price+"и с ДДС е:" +price*1.2;
            }
            let otbor = prompt("Любимият ви отбор е:");
            if(otbor === "Спортист")
            {
                document.write("Само Тошево");
            }
            else if(otbor === "ЦСКА")
            {
                document.write("Бягай ги тез");
            }
            else if(otbor === "Левски")
            {
                document.write("Какво се правите на патриоти");
            }
            else {
                document.write("Изберете си истински отбор")
            }
            </script>
            <span id="result"></span>
            <button onclick="fun()">Click me!</button>
    </body>
